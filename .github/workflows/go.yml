name: Go

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        directory:
          - '.'
          - './plugin'
          - './wrappers/aead'
          - './wrappers/alicloudkms'
          - './wrappers/awskms'
          - './wrappers/azurekeyvault'
          - './wrappers/gcpckms'
          - './wrappers/huaweicloudkms'
          - './wrappers/kmip'
          - './wrappers/ocikms'
          - './wrappers/ovhcloudkms'
          - './wrappers/pkcs11'
          - './wrappers/static'
          - './wrappers/tcloudpublickms'
          - './wrappers/tencentcloudkms'
          - './wrappers/transit'
          - './kms/pkcs11'
          - './kms/transit'
        go:
          - '1.26'
        platform:
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Dockerfile
        id: dockerfile
        working-directory: ${{ matrix.directory }}
        run: |-
          if [[ -f Dockerfile ]]; then
            echo exists=true >> $GITHUB_OUTPUT
          else
            echo exists=false >> $GITHUB_OUTPUT
          fi

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.dockerfile.outputs.exists == 'false'
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.directory }}/go.mod

      - name: Tests
        if: steps.dockerfile.outputs.exists == 'false'
        working-directory: ${{ matrix.directory }}
        run: go test ./...

      - name: OVH integration tests [PLACEHOLDER]
        if: matrix.directory == './wrappers/ovhcloudkms'
        working-directory: ${{ matrix.directory }}
        env:
          KMS_ACC_TESTS: 'true'
          OVHCLOUDKMS_KEY_ID: ${{ secrets.OVHCLOUDKMS_KEY_ID }}
          OVHCLOUDKMS_ENDPOINT: ${{ secrets.OVHCLOUDKMS_ENDPOINT }}
          OVHCLOUDKMS_ID: ${{ secrets.OVHCLOUDKMS_ID }}
          OVHCLOUDKMS_CERT_CLIENT_CERT: ${{ secrets.OVHCLOUD_CERT_CLIENT_CERT }}
          OVHCLOUDKMS_CERT_CLIENT_KEY: ${{ secrets.OVHCLOUD_CERT_CLIENT_KEY }}
          OVHCLOUDKMS_SERVICE_ACCOUNT_NAME: ${{ secrets.OVHCLOUDKMS_SERVICE_ACCOUNT_NAME }}
          OVHCLOUDKMS_SERVICE_ACCOUNT_PASSWORD: ${{ secrets.OVHCLOUDKMS_SERVICE_ACCOUNT_PASSWORD }}
        run: go test ./...

      - name: Container tests
        if: steps.dockerfile.outputs.exists == 'true'
        run: docker build -f '${{ matrix.directory }}/Dockerfile' .
